name: Update NEO Dashboard

on:
  schedule:
    # 22:00 UTC == 06:00 Asia/Shanghai
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neo-dashboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Generate dashboard (public APIs only)
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: python generate_static_api.py

      - name: Commit generated files to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data.js generate_static_api.py .github/workflows/update-dashboard.yml
          if git diff --staged --quiet; then
            echo "No changes to commit on main."
          else
            git commit -m "deploy: dashboard update $(date -u '+%Y-%m-%d %H:%M')"
            git push origin HEAD:main
          fi

      - name: Deploy to gh-pages
        run: |
          set -e
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          rm -rf /tmp/ghp
          git worktree add --detach /tmp/ghp origin/gh-pages
          cp index.html data.js /tmp/ghp/
          cd /tmp/ghp
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data.js
          if git diff --staged --quiet; then
            echo "No changes to deploy on gh-pages."
          else
            git commit -m "deploy: dashboard update $(date -u '+%Y-%m-%d %H:%M')"
            git push origin HEAD:gh-pages
          fi
